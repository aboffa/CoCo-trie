name: Build_and_test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure sanitizers
        if: matrix.build_type == 'Debug'
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DCOCO_SANITIZERS=ON
      - name: Check boundary cases with sanitizers
        if: matrix.build_type == 'Debug'
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cmake --build build-sanitize --target tests_boundaries tests_sorted_builder --parallel 2
          ctest --test-dir build-sanitize -R 'tests_(boundaries|sorted_builder)' --output-on-failure

  wide-alphabet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev cmake clang
      - name: Configure Clang with wide integers and sanitizers
        run: >-
          cmake -S . -B build-wide -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g"
          -DCOCO_REQUIRE_UINT256=ON -DCOCO_SANITIZERS=ON
      - name: Build wide alphabet and alphabet tests
        run: cmake --build build-wide --target tests_alphabet_width --parallel 2
      - name: Test wide integers, binary keys, tails, and serialization
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-wide -R tests_alphabet_width --output-on-failure
